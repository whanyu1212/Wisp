# Wisp built-in model catalog.
#
# Describes which models each registered provider supports, for validation and
# `/model` enumeration and optional list-price estimates only -- it does not
# configure providers (base URLs, auth env vars, and wire formats stay hardcoded
# in each Provider implementation).
#
# A user-only overlay at ~/.wisp/catalog.toml may add or extend provider entries.
# Project-local catalogs are never read: a cloned repository must not be able to
# redirect provider metadata.

schema_version = 2

[[providers]]
name = "openai"
display_name = "OpenAI"
default_model = "gpt-5.6-sol"
docs_url = "https://platform.openai.com/docs"
# Current Responses-API text/tool models verified against OpenAI's model
# catalog on 2026-07-18. Excludes specialized audio, image, realtime,
# embeddings, moderation, and deprecated models.
models = [
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.5-pro",
    "gpt-5.4",
    "gpt-5.4-mini",
]

[providers.model_aliases]
"gpt-5.6" = "gpt-5.6-sol"

[providers.context_windows]
"gpt-5.6-sol" = 1050000
"gpt-5.6-terra" = 1050000
"gpt-5.6-luna" = 1050000
"gpt-5.5" = 272000
"gpt-5.5-pro" = 1050000
"gpt-5.4" = 272000
"gpt-5.4-mini" = 400000

[providers.model_lifecycle]
"gpt-5.6-sol" = "stable"
"gpt-5.6-terra" = "stable"
"gpt-5.6-luna" = "stable"
"gpt-5.5" = "legacy"
"gpt-5.5-pro" = "legacy"
"gpt-5.4" = "legacy"
"gpt-5.4-mini" = "legacy"

# Effort tiers sourced from the current model pages and OpenAI's
# reasoning-effort guide. Older models remain usable but are omitted unless
# their exact accepted subsets are documented.
[providers.effort_levels]
"gpt-5.6-sol" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.6-terra" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.6-luna" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.5" = ["none", "minimal", "low", "medium", "high", "xhigh"]

# OpenAI standard API list prices per million tokens, verified 2026-07-19:
# https://developers.openai.com/api/docs/pricing
# GPT-5.6 model pages document the >272K-input long-context threshold. Prices
# are snapshots used for new requests only; historical sessions retain their
# selected rate snapshot instead of being repriced after catalog changes.
[[providers.pricing."gpt-5.6-sol"]]
input_usd_per_million = "5"
cache_read_usd_per_million = "0.5"
cache_write_usd_per_million = "6.25"
output_usd_per_million = "30"

[[providers.pricing."gpt-5.6-sol"]]
input_token_threshold = 272001
input_usd_per_million = "10"
cache_read_usd_per_million = "1"
cache_write_usd_per_million = "12.5"
output_usd_per_million = "45"

[[providers.pricing."gpt-5.6-terra"]]
input_usd_per_million = "2.5"
cache_read_usd_per_million = "0.25"
cache_write_usd_per_million = "3.125"
output_usd_per_million = "15"

[[providers.pricing."gpt-5.6-terra"]]
input_token_threshold = 272001
input_usd_per_million = "5"
cache_read_usd_per_million = "0.5"
cache_write_usd_per_million = "6.25"
output_usd_per_million = "22.5"

[[providers.pricing."gpt-5.6-luna"]]
input_usd_per_million = "1"
cache_read_usd_per_million = "0.1"
cache_write_usd_per_million = "1.25"
output_usd_per_million = "6"

[[providers.pricing."gpt-5.6-luna"]]
input_token_threshold = 272001
input_usd_per_million = "2"
cache_read_usd_per_million = "0.2"
cache_write_usd_per_million = "2.5"
output_usd_per_million = "9"

[[providers.pricing."gpt-5.5"]]
input_usd_per_million = "5"
cache_read_usd_per_million = "0.5"
output_usd_per_million = "30"

[[providers.pricing."gpt-5.5"]]
input_token_threshold = 272001
input_usd_per_million = "10"
