    "gpt-5.6-luna",
]

[providers.model_aliases]
"gpt-5.6" = "gpt-5.6-sol"

# Codex subscription limits are provider-surface metadata and intentionally
# differ from the direct OpenAI Responses API for several shared model ids.
[providers.context_windows]
"gpt-6.1-sol" = 500000
"gpt-6-astra" = 272000
"gpt-6-sol" = 272000
"gpt-6-luna" = 272000
"gpt-5.6-sol" = 272000
"gpt-5.6-terra" = 272000
"gpt-5.6-luna" = 272000

