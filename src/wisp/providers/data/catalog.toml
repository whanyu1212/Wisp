display_name = "OpenAI Codex (ChatGPT subscription)"
default_model = "gpt-5.6-sol"
docs_url = "https://developers.openai.com/codex/models"
# Current Codex CLI subscription picker models verified against the Codex model
# guide and local Codex backend model metadata on 2026-10-13. GPT-6.1 Sol has
# a larger provider-surface context than the other listed subscription models.
# Ultra is agent orchestration, not a provider reasoning-effort tier.
models = [
    "gpt-6.1-sol",
    "gpt-6-astra",
    "gpt-6-sol",
    "gpt-6-luna",
    "gpt-5.6-sol",
