[[providers]]
name = "openai-codex"
display_name = "OpenAI (Codex subscription)"
default_model = "gpt-5.6-sol"
docs_url = "https://developers.openai.com/codex/models"
# Current Codex CLI subscription models verified against the Codex model guide
# on 2026-07-18. Context metadata was verified against the Codex backend model
# catalog and openai/codex models-manager metadata on 2026-08-06. The
# access-controlled gpt-5.3-codex-spark preview is excluded.
models = [
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.4-mini",
]

[providers.model_aliases]
"gpt-5.6" = "gpt-5.6-sol"

# Codex subscription limits are provider-surface metadata and intentionally
# differ from the direct OpenAI Responses API for several shared model ids.
[providers.context_windows]
"gpt-5.6-sol" = 272000
"gpt-5.6-terra" = 272000
"gpt-5.6-luna" = 272000
"gpt-5.5" = 272000
"gpt-5.4" = 272000
"gpt-5.4-mini" = 272000

# Codex derives automatic compaction at 90% of its nominal context window.
# Wisp treats these as upper bounds: a larger user reserve still triggers
# compaction earlier, while a smaller reserve cannot weaken this safeguard.
[providers.auto_compact_token_limits]
"gpt-5.6-sol" = 244800
"gpt-5.6-terra" = 244800
"gpt-5.6-luna" = 244800
"gpt-5.5" = 244800
"gpt-5.4" = 244800
"gpt-5.4-mini" = 244800

[providers.model_lifecycle]
"gpt-5.6-sol" = "stable"
"gpt-5.6-terra" = "stable"
"gpt-5.6-luna" = "stable"
"gpt-5.5" = "legacy"
"gpt-5.4" = "legacy"
"gpt-5.4-mini" = "legacy"

[providers.effort_levels]
# Codex subscription models all expose request-level reasoning effort. GPT-5.6
# adds max; older models top out at xhigh. Minimal is omitted because Codex maps
# it to low rather than accepting it as a distinct provider effort. Ultra is
# agent orchestration, not a provider effort tier.
"gpt-5.6-sol" = ["low", "medium", "high", "xhigh", "max"]
"gpt-5.6-terra" = ["low", "medium", "high", "xhigh", "max"]
"gpt-5.6-luna" = ["low", "medium", "high", "xhigh", "max"]
"gpt-5.5" = ["low", "medium", "high", "xhigh"]
"gpt-5.4" = ["low", "medium", "high", "xhigh"]
"gpt-5.4-mini" = ["low", "medium", "high", "xhigh"]

[[providers]]
