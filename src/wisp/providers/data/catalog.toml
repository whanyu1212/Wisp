# Wisp built-in model catalog.
#
# Describes which models each registered provider supports, for validation and
# `/model` enumeration only -- it does not configure providers (base URLs, auth
# env vars, and wire formats stay hardcoded in each Provider implementation).
#
# A user-only overlay at ~/.wisp/catalog.toml may add or extend provider entries.
# Project-local catalogs are never read: a cloned repository must not be able to
# redirect provider metadata.

schema_version = 1

[[providers]]
name = "openai"
display_name = "OpenAI"
default_model = "gpt-5.6-sol"
docs_url = "https://platform.openai.com/docs"
# Current Responses-API text/tool models verified against OpenAI's model
# catalog on 2026-07-18. Excludes specialized audio, image, realtime,
# embeddings, moderation, and deprecated models.
models = [
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.5-pro",
    "gpt-5.4",
    "gpt-5.4-mini",
]

[providers.model_aliases]
"gpt-5.6" = "gpt-5.6-sol"

[providers.context_windows]
"gpt-5.6-sol" = 1050000
"gpt-5.6-terra" = 1050000
"gpt-5.6-luna" = 1050000
"gpt-5.5" = 272000
"gpt-5.5-pro" = 1050000
"gpt-5.4" = 272000
"gpt-5.4-mini" = 400000

[providers.model_lifecycle]
"gpt-5.6-sol" = "stable"
"gpt-5.6-terra" = "stable"
"gpt-5.6-luna" = "stable"
"gpt-5.5" = "legacy"
"gpt-5.5-pro" = "legacy"
"gpt-5.4" = "legacy"
"gpt-5.4-mini" = "legacy"

# Effort tiers sourced from the current model pages and OpenAI's
# reasoning-effort guide. Older models remain usable but are omitted unless
# their exact accepted subsets are documented.
[providers.effort_levels]
"gpt-5.6-sol" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.6-terra" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.6-luna" = ["none", "low", "medium", "high", "xhigh", "max"]
"gpt-5.5" = ["none", "minimal", "low", "medium", "high", "xhigh"]

[[providers]]
name = "openai-codex"
display_name = "OpenAI (Codex subscription)"
default_model = "gpt-5.6-sol"
docs_url = "https://developers.openai.com/codex/models"
# Current Codex CLI subscription models verified against the Codex model guide
# on 2026-07-18. The access-controlled gpt-5.3-codex-spark preview is excluded.
models = [
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.4-mini",
]

[providers.model_aliases]
"gpt-5.6" = "gpt-5.6-sol"

[providers.context_windows]
"gpt-5.6-sol" = 1050000
"gpt-5.6-terra" = 1050000
"gpt-5.6-luna" = 1050000
"gpt-5.5" = 272000
"gpt-5.4" = 272000
"gpt-5.4-mini" = 400000

[providers.model_lifecycle]
"gpt-5.6-sol" = "stable"
"gpt-5.6-terra" = "stable"
"gpt-5.6-luna" = "stable"
"gpt-5.5" = "legacy"
"gpt-5.4" = "legacy"
"gpt-5.4-mini" = "legacy"

[providers.effort_levels]
# The Codex model guide documents these request-level choices for its default
# GPT-5.6 Sol model. Ultra is agent orchestration, not a provider effort tier.
"gpt-5.6-sol" = ["low", "medium", "high", "xhigh", "max"]

[[providers]]
name = "anthropic"
display_name = "Anthropic"
default_model = "claude-sonnet-5"
docs_url = "https://platform.claude.com/docs"
models = [
    "claude-fable-5",
    "claude-sonnet-5",
    "claude-opus-4-8",
    "claude-haiku-4-5",
    "claude-opus-4-7",
    "claude-opus-4-6",
    "claude-sonnet-4-6",
]

[providers.context_windows]
"claude-fable-5" = 1000000
"claude-sonnet-5" = 1000000
"claude-opus-4-8" = 1000000
"claude-haiku-4-5" = 200000
"claude-opus-4-7" = 1000000
"claude-opus-4-6" = 1000000
"claude-sonnet-4-6" = 1000000

[providers.model_lifecycle]
"claude-fable-5" = "stable"
"claude-sonnet-5" = "stable"
"claude-opus-4-8" = "stable"
"claude-haiku-4-5" = "stable"
"claude-opus-4-7" = "legacy"
"claude-opus-4-6" = "legacy"
"claude-sonnet-4-6" = "legacy"

# Effort tiers sourced from Anthropic's effort guide and confirmed live via
# client.models.retrieve(id).capabilities.effort where available.
# claude-haiku-4-5 is deliberately omitted -- capabilities.effort.supported is
# False for it (no effort control at all).
[providers.effort_levels]
"claude-fable-5" = ["low", "medium", "high", "xhigh", "max"]
"claude-sonnet-5" = ["low", "medium", "high", "xhigh", "max"]
"claude-opus-4-8" = ["low", "medium", "high", "xhigh", "max"]
"claude-opus-4-7" = ["low", "medium", "high", "xhigh", "max"]
"claude-opus-4-6" = ["low", "medium", "high", "max"]
"claude-sonnet-4-6" = ["low", "medium", "high", "max"]

[[providers]]
name = "google"
display_name = "Google"
default_model = "gemini-3.5-flash"
docs_url = "https://ai.google.dev/gemini-api/docs"
# The Google provider uses the Gemini Developer API. These IDs are sourced from
# Google's current model documentation; account availability still varies by API
# key and should be checked with the Models API before changing this list.
models = [
    "gemini-3.5-flash",
    "gemini-3.1-flash-lite",
    "gemini-2.5-pro",
    "gemini-2.5-flash",
    "gemini-2.5-flash-lite",
    "gemini-3.1-pro-preview",
    "gemini-3-flash-preview",
]

[providers.model_aliases]
"gemini-flash-latest" = "gemini-3.5-flash"

[providers.context_windows]
"gemini-3.5-flash" = 1048576
"gemini-3.1-flash-lite" = 1048576
"gemini-2.5-pro" = 1048576
"gemini-2.5-flash" = 1048576
"gemini-2.5-flash-lite" = 1048576
"gemini-3.1-pro-preview" = 1048576
"gemini-3-flash-preview" = 1048576

[providers.model_lifecycle]
"gemini-3.5-flash" = "stable"
"gemini-3.1-flash-lite" = "stable"
"gemini-2.5-pro" = "legacy"
"gemini-2.5-flash" = "legacy"
"gemini-2.5-flash-lite" = "legacy"
"gemini-3.1-pro-preview" = "preview"
"gemini-3-flash-preview" = "preview"

# Gemini 3.5 Flash and 3.1 Flash-Lite support named thinking levels. Gemini 2.5
# models use numeric thinking budgets, which this provider intentionally does
# not map from named tiers. Other models stay unset until API validation.
[providers.effort_levels]
"gemini-3.5-flash" = ["MINIMAL", "LOW", "MEDIUM", "HIGH"]
"gemini-3.1-flash-lite" = ["MINIMAL", "LOW", "MEDIUM", "HIGH"]

[[providers]]
name = "fake"
display_name = "Fake (offline testing)"
default_model = "fake"
docs_url = "https://github.com/whanyu1212/Wisp"
models = ["fake"]

[providers.context_windows]
fake = 1000

[providers.model_lifecycle]
fake = "stable"
