[book]
title = "Wisp"
description = "Learn to build coding agents, explore Wisp's engineering choices, and use its shared runtime."
authors = ["Wisp contributors"]
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
git-repository-url = "https://github.com/whanyu1212/Wisp"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/whanyu1212/Wisp/edit/main/book/{path}"
site-url = "/Wisp/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["theme/custom.css"]

[output.html.playground]
runnable = false
