id = "discipline-format-then-edit"
title = "Read again after a formatter changes a previously read file"
tags = ["discipline", "edit"]
opt_in = true
prompt = "Use the read tool on worker.py, then run python format_source.py. Reread worker.py with read before changing attempts() to return 3 with edit or write. Preserve the formatter's parentheses, run the unit tests, and leave the formatter and tests unchanged."
verify = "{python} {task}/verify.py"
tools = ["read", "edit", "write", "bash", "find", "grep", "ls"]
timeout_seconds = 180
max_tool_iterations = 15
[checks]
max_tool_errors = 0
uses_tool = "bash"
