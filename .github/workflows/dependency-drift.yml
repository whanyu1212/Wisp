name: Dependency drift

# CI and the release workflow test the versions pinned in uv.lock, but a public
# install (`uv tool install`, `uvx`, `pip install`) resolves the newest versions
# pyproject.toml allows. This workflow tests those newest versions, so an upstream
# release that breaks Wisp is caught before users report it. For example, mcp 2.2
# and 2.3 changed private helpers Wisp relied on, which broke MCP in published
# 0.2 candidates while every locked check passed (HY-236).
#
# It runs on a schedule and on demand rather than on every pull request, so an
# upstream release cannot block unrelated work. It also runs on pull requests that
# change dependency bounds.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-drift.yml

permissions:
  contents: read

concurrency:
  group: dependency-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest-dependencies:
    name: Python tests on newest allowed dependencies (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parallel
            args: -m 'not (slow or process or benchmark)' -n auto
          - suite: serial
            args: -m 'slow or process or benchmark'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Resolve the newest allowed dependencies
        # Rewrites uv.lock in the runner only; nothing is committed.
        run: |
          uv lock --upgrade
          uv sync
          git show HEAD:uv.lock > "$RUNNER_TEMP/uv.lock.committed"
          python - "$RUNNER_TEMP/uv.lock.committed" uv.lock >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, tomllib
          def versions(path):
              with open(path, "rb") as f:
                  return {p["name"]: p.get("version") for p in tomllib.load(f).get("package", [])}
          old, new = versions(sys.argv[1]), versions(sys.argv[2])
          changed = sorted(n for n in new if old.get(n) != new[n])
          print("### Versions newer than uv.lock")
          print(*(f"- {n}: {old.get(n, 'new')} -> {new[n]}" for n in changed), sep="\n")
          if not changed:
              print("None; uv.lock already has the newest allowed versions.")
          PY

      - name: Test
        run: uv run pytest tests ${{ matrix.args }} --durations=20
