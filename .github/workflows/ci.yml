name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check live RPC schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          schema_args=(--check)
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            schema_args+=(--immutable-base "$BASE_SHA")
          fi
          uv run python -m wisp.rpc.protocol_schema "${schema_args[@]}"

      - name: Type-check
        run: uv run mypy

  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - name: Check generated protocol artifacts
        run: uv run python -m wisp.rpc.protocol_schema --check

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

      - name: Build Rust TUI
        run: cargo build -p wisp-tui

      - name: Test Python/Rust TUI handoff
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
        run: uv run pytest tests/test_rust_tui_smoke.py

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify installed SDK surface
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          pushd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" \
            python "$GITHUB_WORKSPACE/scripts/verify_sdk_install.py"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run --isolated --no-project --with "$wheel" \
            python -m examples.sdk.minimal
          popd

  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            target: tests
            marker: not (slow or tui or process or benchmark or production_fault)
            extra_args: ""
          - suite: tui-integration
            target: tests/test_tui_integration_cli.py
            marker: tui and not production_fault
            extra_args: ""
          - suite: tui-components
            target: tests
            marker: tui and not production_fault
            extra_args: --ignore=tests/test_tui_integration_cli.py
          - suite: system-and-slow
            target: tests
            marker: (slow or process or benchmark) and not (tui or production_fault)
            extra_args: ""
          - suite: production-fault
            target: tests
            marker: production_fault
            extra_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test ${{ matrix.suite }} suite
        env:
          WISP_TRUST: "1"
          WISP_EFFORT: xhigh
          WISP_CONTEXT_RESERVE_TOKENS: "4096"
          WISP_AUTO_COMPACTION: "0"
        run: >-
          uv run pytest ${{ matrix.target }}
          -m '${{ matrix.marker }}'
          ${{ matrix.extra_args }}
          --durations=20

  tui-status:
    name: Test (tui)
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the split test matrix to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  macos-smoke:
    name: Platform smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths
        env:
          WISP_TRUST: "1"
        run: >-
          uv run pytest
          tests/test_auth_storage.py
          tests/test_mcp_runtime_process.py
          tests/test_process_manager.py
          tests/test_rpc_transport.py
          tests/test_secure_tool_filesystem.py
          tests/test_sessions.py
          --durations=20

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake
