name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # Debug and test builds keep only line tables, so panics still report file and
  # line while builds link faster and the Rust caches stay small. rust-cache
  # hashes CARGO_* variables into its key, so changing this starts fresh caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      python: ${{ steps.select.outputs.python }}
      macos_smoke: ${{ steps.select.outputs.macos_smoke }}
      python_oldest: ${{ steps.select.outputs.python_oldest }}
      rust: ${{ steps.select.outputs.rust }}
      rust_macos: ${{ steps.select.outputs.rust_macos }}
      handoff: ${{ steps.select.outputs.handoff }}
      package: ${{ steps.select.outputs.package }}
      contracts: ${{ steps.select.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test check selection and required-check enforcement
        run: python3 -m unittest discover -s tests/scripts -p test_ci_jobs.py
      - name: Select checks from the complete Git diff
        id: select
        run: python3 scripts/ci_jobs.py select

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    name: Format, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check live RPC schemas
        run: uv run python -m wisp.rpc.protocol_schema --check

      - name: Type-check
        run: uv run mypy

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # wisp-python targets abi3-py311 and does not run Python during Rust lint/test.
      # Skipping interpreter discovery removes pyo3-build-config's
      # rerun-if-env-changed=PATH trigger, keeping pyo3 warm in rust-cache.
      PYO3_NO_PYTHON: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-lint-ubuntu-latest
          # CI installs nothing with `cargo install`; ~/.cargo/bin holds only rustup.
          cache-bin: false

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-workspace:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ needs.changes.outputs.rust_macos == 'true' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # wisp-python targets abi3-py311 and does not run Python during Rust lint/test.
      # Skipping interpreter discovery removes pyo3-build-config's
      # rerun-if-env-changed=PATH trigger, keeping pyo3 warm in rust-cache.
      PYO3_NO_PYTHON: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The macOS image ships Homebrew's rustup. Its cargo shim can't run rustc
      # in rust-cache's post step, so `cargo metadata` fails and rust-cache saves
      # an empty cache (actions/runner-images#14099). Remove it so the toolchain
      # step installs its own rustup into ~/.cargo/bin.
      - name: Remove Homebrew rustup
        if: runner.os == 'macOS'
        run: |
          if brew list rustup &>/dev/null; then
            brew uninstall --ignore-dependencies rustup
          fi
          rm -rf "$HOME/.cargo/bin"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: ${{ runner.os == 'macOS' && 'clippy' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-test-${{ matrix.os }}
          # CI installs nothing with `cargo install`; ~/.cargo/bin holds only rustup.
          cache-bin: false

      # Full workspace clippy runs in parallel in rust-lint on Linux; only
      # wisp-search contains macOS-conditional code.
      - name: Lint macOS-specific Rust code
        if: runner.os == 'macOS'
        run: cargo clippy -p wisp-search --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

  # The PTY handoff tests run beside lint and unit tests rather than after them.
  # macOS runs them on nightly schedule and manual runs, so pull requests and
  # routine main pushes skip its slower runners; a macOS failure there still
  # fails the run.
  tui-handoff:
    needs: changes
    if: needs.changes.outputs.handoff == 'true'
    name: TUI handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      # The macOS image ships Homebrew's rustup. Its cargo shim can't run rustc
      # in rust-cache's post step, so `cargo metadata` fails and rust-cache saves
      # an empty cache (actions/runner-images#14099). Remove it so the toolchain
      # step installs its own rustup into ~/.cargo/bin.
      - name: Remove Homebrew rustup
        if: runner.os == 'macOS'
        run: |
          if brew list rustup &>/dev/null; then
            brew uninstall --ignore-dependencies rustup
          fi
          rm -rf "$HOME/.cargo/bin"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tui-handoff-v2-${{ matrix.os }}
          # CI installs nothing with `cargo install`; ~/.cargo/bin holds only rustup.
          cache-bin: false

      - name: Build Rust TUI
        run: cargo build -p wisp-tui

      - name: Test Python/Rust TUI handoff
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
          # Linux runs the end-to-end tests across workers; each spawns its own PTY
          # and backend. macOS keeps one worker.
          WORKERS: ${{ runner.os == 'Linux' && '4' || '0' }}
        # The per-test timeout turns a silent hang into a named failure with a
        # traceback instead of letting it consume the whole job timeout. The
        # signal method fails only that test, so later tests and the JUnit
        # report still run.
        run: >-
          uv run pytest tests/tui_e2e -n "$WORKERS" --durations=20
          --timeout=90 --timeout-method=signal
          --junitxml=test-results/rust-smoke/e2e.xml

      - name: Test TUI benchmark harnesses
        # The TUI benchmark harnesses' PTY runs (skipped without the binary) keep
        # working against the current CLI. Non-TUI benchmarks do not use the binary
        # and already run in python-tests.
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
        run: >-
          uv run pytest tests/benchmarks/test_tui_*.py --durations=20
          --timeout=90 --timeout-method=signal
          --junitxml=test-results/rust-smoke/benchmarks.xml

      - name: Upload Rust handoff test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust-smoke-${{ matrix.os }}
          overwrite: true
          path: test-results/rust-smoke/
          if-no-files-found: warn

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify installed SDK surface
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          pushd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" \
            python "$GITHUB_WORKSPACE/scripts/verify_sdk_install.py"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run --isolated --no-project --with "$wheel" \
            python -m examples.sdk.minimal
          popd

  python-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parallel-1
            args: tests -m 'not (slow or process or benchmark)' -n auto --shard 1/2
          - suite: parallel-2
            args: tests -m 'not (slow or process or benchmark)' -n auto --shard 2/2
          # Process, slow, and benchmark tests assert timing and resource
          # bounds that flake when they compete with parallel workers.
          - suite: serial-1
            args: tests -m 'slow or process or benchmark' -k 'not test_every_module_imports_fresh' --shard 1/3
          - suite: serial-2
            args: tests -m 'slow or process or benchmark' -k 'not test_every_module_imports_fresh' --shard 2/3
          - suite: serial-3
            args: tests -m 'slow or process or benchmark' -k 'not test_every_module_imports_fresh' --shard 3/3
          # Spawns a fresh Python process per module (~38s on its own).
          - suite: fresh-imports
            args: tests/repository/test_architecture.py -k 'test_every_module_imports_fresh'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: >-
          uv run pytest ${{ matrix.args }}
          --durations=20
          --junitxml=test-results/${{ matrix.suite }}/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          overwrite: true
          path: test-results/${{ matrix.suite }}/
          if-no-files-found: error

  # The development Python is pinned in .python-version; this job runs on the oldest
  # supported Python (requires-python in pyproject.toml) on nightly schedules, manual runs,
  # shared-input pushes, and changes touching dependency, Python, or CI configuration.
  python-tests-oldest:
    needs: changes
    if: needs.changes.outputs.python_oldest == 'true'
    name: Python tests on 3.11 (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parallel-1
            args: tests -m 'not (slow or process or benchmark)' -n auto --shard 1/2
          - suite: parallel-2
            args: tests -m 'not (slow or process or benchmark)' -n auto --shard 2/2
          - suite: serial-1
            args: tests -m 'slow or process or benchmark' -k 'not test_every_module_imports_fresh' --shard 1/2
          - suite: serial-2
            args: tests -m 'slow or process or benchmark' -k 'not test_every_module_imports_fresh' --shard 2/2
          - suite: fresh-imports
            args: tests/repository/test_architecture.py -k 'test_every_module_imports_fresh'
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: >-
          uv run pytest ${{ matrix.args }}
          --durations=20
          --junitxml=test-results/oldest-${{ matrix.suite }}/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-oldest-${{ matrix.suite }}
          overwrite: true
          path: test-results/oldest-${{ matrix.suite }}/
          if-no-files-found: error

  macos-smoke:
    needs: changes
    if: needs.changes.outputs.macos_smoke == 'true'
    name: Platform smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths (parallel)
        run: >-
          uv run pytest
          tests/auth/test_storage.py
          tests/cli/test_rpc_transport.py
          tests/tools/files/test_secure_fs.py
          tests/tools/test_seatbelt.py
          tests/tools/test_shell_auto_workflows.py
          tests/tools/shell/test_working_directory.py
          tests/coding/test_sandbox_process_approvals.py
          tests/sessions
          -m 'not benchmark'
          -n 2
          --durations=20
          --junitxml=test-results/macos-smoke/parallel.xml

      - name: Test timing-sensitive macOS paths (serial)
        run: |
          uv run pytest \
            tests/mcp/test_runtime_process.py \
            tests/tools/shell/test_supervisor*.py \
            --durations=20 \
            --junitxml=test-results/macos-smoke/serial.xml
          uv run pytest \
            tests/sessions -m benchmark \
            --durations=20 \
            --junitxml=test-results/macos-smoke/benchmarks.xml

      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-smoke
          overwrite: true
          path: test-results/macos-smoke/
          if-no-files-found: warn

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake

  contracts:
    name: Documentation and repository contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: uv run pytest tests/docs tests/repository --durations=20

  # Always report the required status, including when selection fails. Only jobs
  # explicitly excluded by the successful plan may be skipped.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, quality, rust-lint, rust-workspace, tui-handoff, package, python-tests, python-tests-oldest, macos-smoke, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_jobs.py verify
