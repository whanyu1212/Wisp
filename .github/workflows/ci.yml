name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            marker: not (slow or tui or process or benchmark or production_fault)
          - suite: tui
            marker: tui and not production_fault
          - suite: system-and-slow
            marker: (slow or process or benchmark) and not (tui or production_fault)
          - suite: production-fault
            marker: production_fault

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test ${{ matrix.suite }} suite
        env:
          WISP_TRUST: "1"
          WISP_EFFORT: xhigh
          WISP_CONTEXT_RESERVE_TOKENS: "4096"
          WISP_AUTO_COMPACTION: "0"
        run: uv run pytest tests -m '${{ matrix.marker }}' --durations=20

  macos-smoke:
    name: Platform smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths
        env:
          WISP_TRUST: "1"
        run: >-
          uv run pytest
          tests/test_auth_storage.py
          tests/test_mcp_runtime_process.py
          tests/test_process_manager.py
          tests/test_rpc_transport.py
          tests/test_secure_tool_filesystem.py
          tests/test_sessions.py
          --durations=20

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake
