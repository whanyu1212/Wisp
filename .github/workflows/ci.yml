name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.select.outputs.python }}
      rust: ${{ steps.select.outputs.rust }}
      handoff: ${{ steps.select.outputs.handoff }}
      package: ${{ steps.select.outputs.package }}
      contracts: ${{ steps.select.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test check selection and required-check enforcement
        run: python3 -m unittest discover -s tests/scripts -p test_ci_jobs.py
      - name: Select checks from the complete Git diff
        id: select
        run: python3 scripts/ci_jobs.py select

  quality:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Format, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check live RPC schemas
        run: uv run python -m wisp.rpc.protocol_schema --check

      - name: Type-check
        run: uv run mypy

  rust-workspace:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: ${{ matrix.os }}

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

  # The PTY handoff tests run beside lint and unit tests rather than after them.
  # macOS runs them only on main: they flake on GitHub's macOS runners (HY-29) and
  # never gate there, so pull requests skip that wait.
  tui-handoff:
    needs: changes
    if: needs.changes.outputs.handoff == 'true'
    name: TUI handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: tui-handoff-${{ matrix.os }}

      - name: Build Rust TUI
        run: cargo build -p wisp-tui

      - name: Test Python/Rust TUI handoff
        # Report macOS failures without failing the job; Linux still gates on them.
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
          # Linux runs the end-to-end tests across workers; each spawns its own PTY
          # and backend. macOS keeps one worker.
          WORKERS: ${{ runner.os == 'Linux' && '4' || '0' }}
        # The per-test timeout turns a silent hang into a named failure with a
        # traceback instead of letting it consume the whole job timeout. The
        # signal method fails only that test, so later tests and the JUnit
        # report still run.
        run: >-
          uv run pytest tests/tui_e2e -n "$WORKERS" --durations=20
          --timeout=90 --timeout-method=signal
          --junitxml=test-results/rust-smoke/e2e.xml

      - name: Test TUI benchmark harnesses
        # The benchmark harnesses' PTY runs (skipped without the binary) keep
        # working against the current CLI. They measure timing, so they run on
        # one worker.
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
        run: >-
          uv run pytest tests/benchmarks --durations=20
          --timeout=90 --timeout-method=signal
          --junitxml=test-results/rust-smoke/benchmarks.xml

      - name: Upload Rust handoff test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust-smoke-${{ matrix.os }}
          overwrite: true
          path: test-results/rust-smoke/
          if-no-files-found: warn

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify installed SDK surface
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          pushd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" \
            python "$GITHUB_WORKSPACE/scripts/verify_sdk_install.py"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run --isolated --no-project --with "$wheel" \
            python -m examples.sdk.minimal
          popd

  python-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parallel
            args: -m 'not (slow or process or benchmark)' -n auto
          # Process, slow, and benchmark tests assert timing and resource
          # bounds that flake when they compete with parallel workers.
          - suite: serial
            args: -m 'slow or process or benchmark'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: >-
          uv run pytest tests ${{ matrix.args }}
          --durations=20
          --junitxml=test-results/${{ matrix.suite }}/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          overwrite: true
          path: test-results/${{ matrix.suite }}/
          if-no-files-found: error

  macos-smoke:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Platform smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths
        run: >-
          uv run pytest
          tests/auth/test_storage.py
          tests/mcp/test_runtime_process.py
          tests/tools/shell/test_supervisor*.py
          tests/cli/test_rpc_transport.py
          tests/tools/files/test_secure_fs.py
          tests/sessions
          --durations=20
          --junitxml=test-results/macos-smoke/junit.xml

      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-smoke
          overwrite: true
          path: test-results/macos-smoke/
          if-no-files-found: warn

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake

  contracts:
    name: Documentation and repository contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: uv run pytest tests/docs tests/repository --durations=20

  # Always report the required status, including when selection fails. Only jobs
  # explicitly excluded by the successful plan may be skipped.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, quality, rust-workspace, tui-handoff, package, python-tests, macos-smoke, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_jobs.py verify
