name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check live RPC schemas
        run: uv run python -m wisp.rpc.protocol_schema --check

      - name: Type-check
        run: uv run mypy

  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: ${{ matrix.os }}

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

      - name: Build Rust TUI
        run: cargo build -p wisp-tui

      - name: Test Python/Rust TUI handoff
        # These PTY tests flake on GitHub's macOS runners only (HY-29). Report
        # failures there without failing the job; Linux still gates on them.
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          RUST_TUI_BINARY_UNDER_TEST: ${{ github.workspace }}/target/debug/wisp-tui
        # The per-test timeout turns a silent hang into a named failure with a
        # traceback instead of letting it consume the whole job timeout. The
        # signal method fails only that test, so later tests and the JUnit
        # report still run.
        run: >-
          uv run pytest tests/rust_tui/test_rust_tui_smoke.py tests/rust_tui/test_rust_tui_themes.py tests/rust_tui/test_rust_tui_mouse.py tests/rust_tui/test_rust_tui_readiness.py tests/rust_tui/test_rust_tui_queue_management.py tests/rust_tui/test_rust_tui_session_catalog.py tests/rust_tui/test_rust_tui_pressure.py --durations=20
          --timeout=90 --timeout-method=signal
          --junitxml=test-results/rust-smoke/junit.xml

      - name: Upload Rust handoff test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust-smoke-${{ matrix.os }}
          overwrite: true
          path: test-results/rust-smoke/
          if-no-files-found: warn

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify installed SDK surface
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          pushd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" \
            python "$GITHUB_WORKSPACE/scripts/verify_sdk_install.py"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run --isolated --no-project --with "$wheel" \
            python -m examples.sdk.minimal
          popd

  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parallel
            args: -m 'not (slow or process or benchmark)' -n auto
          # Process, slow, and benchmark tests assert timing and resource
          # bounds that flake when they compete with parallel workers.
          - suite: serial
            args: -m 'slow or process or benchmark'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: >-
          uv run pytest tests ${{ matrix.args }}
          --durations=20
          --junitxml=test-results/${{ matrix.suite }}/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          overwrite: true
          path: test-results/${{ matrix.suite }}/
          if-no-files-found: error

  macos-smoke:
    name: Platform smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths
        run: >-
          uv run pytest
          tests/runtime/test_auth_storage.py
          tests/mcp/test_mcp_runtime_process.py
          tests/tools/test_process_manager.py
          tests/rpc/test_rpc_transport.py
          tests/tools/test_secure_tool_filesystem.py
          tests/sessions/test_sessions.py
          --durations=20
          --junitxml=test-results/macos-smoke/junit.xml

      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-smoke
          overwrite: true
          path: test-results/macos-smoke/
          if-no-files-found: warn

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake

  # The one required status check: it passes only when every job above
  # succeeds, so adding or renaming a job never needs a ruleset change.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [quality, rust-workspace, package, python-tests, macos-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
