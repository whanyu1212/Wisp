name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check live RPC schemas
        run: uv run python -m wisp.rpc.protocol_schema --check

      - name: Type-check
        run: uv run mypy

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

      - name: Test
        env:
          WISP_TRUST: "1"
          WISP_EFFORT: xhigh
          WISP_CONTEXT_RESERVE_TOKENS: "4096"
          WISP_AUTO_COMPACTION: "0"
        run: uv run pytest tests

  verify-macos:
    name: Verify macOS support
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Test platform-sensitive paths
        env:
          WISP_TRUST: "1"
        run: >-
          uv run pytest
          tests/test_mcp_runtime_process.py
          tests/test_process_manager.py
          tests/test_rpc_transport.py
          tests/test_secure_tool_filesystem.py
          --durations=20

      - name: Smoke-test fake-provider CLI
        env:
          WISP_TRUST: "1"
        run: uv run wisp -p "hello" --provider fake

  native-wheels:
    name: Build native Rust TUI wheels
    needs:
      - verify
      - verify-macos
    uses: ./.github/workflows/rust-tui-wheels.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs:
      - verify
      - verify-macos
      - native-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.release-version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # PyPI versions are immutable, so every dry run checks project/runtime
      # consistency and exports PEP 440 prerelease metadata for the release job.
      - name: Check and classify project version
        id: release-version
        run: |
          project_version="$(uv version --short)"
          runtime_version="$(PYTHONPATH=src python -c 'import wisp; print(wisp.__version__)')"
          if [ "$project_version" != "$runtime_version" ]; then
            echo "Project version ${project_version} does not match runtime version ${runtime_version}." >&2
            exit 1
          fi
          prerelease="$(
            uv run --no-project --with packaging python -c \
              'from packaging.version import Version; import sys; print(str(Version(sys.argv[1]).is_prerelease).lower())' \
              "$project_version"
          )"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # A tag can point at any commit, so reconcile it with the version baked
      # into the distributions before anything is uploaded.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          project_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}." >&2
            exit 1
          fi

      - name: Build
        run: uv build --no-sources

      - name: Download manylinux Rust TUI wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-tui-wheel-manylinux-x86-64
          path: native-artifacts/manylinux-x86-64

      - name: Download macOS arm64 Rust TUI wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-tui-wheel-arm64-macos
          path: native-artifacts/macos-arm64

      - name: Assemble and verify native artifacts
        run: |
          mkdir -p release-assets
          for target in manylinux-x86-64 macos-arm64; do
            directory="native-artifacts/${target}"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            cp "$directory"/*.whl dist/
            cp "$directory/SHA256SUMS" "release-assets/wisp-tui-${target}.sha256"
            cp "$directory/wisp-tui.cdx.json" "release-assets/wisp-tui-${target}.cdx.json"
            cp "$directory/wisp-python.cdx.json" \
              "release-assets/wisp-python-${target}.cdx.json"
            cp "$directory/install-evidence.json" \
              "release-assets/wisp-tui-${target}-install.json"
          done
          uv run python scripts/verify_rust_tui_wheel.py \
            --release-dir dist --release-assets release-assets

      - name: Build live RPC schema bundle
        run: |
          protocol_version="$(
            uv run python -c \
              'from wisp.rpc.protocol import LIVE_RPC_PROTOCOL_VERSION; print(LIVE_RPC_PROTOCOL_VERSION)'
          )"
          uv run python -m wisp.rpc.protocol_schema \
            --archive "release-assets/wisp-live-rpc-v${protocol_version}.tar.gz"

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify installed SDK surface
        run: |
          shopt -s nullglob
          wheels=(dist/*-py3-none-any.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one pure fallback wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          pushd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" \
            python "$GITHUB_WORKSPACE/scripts/verify_sdk_install.py"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run --isolated --no-project --with "$wheel" \
            python -m examples.sdk.minimal
          popd

      - name: Smoke-test packaged commands
        env:
          WISP_TRUST: "1"
        run: |
          shopt -s nullglob
          wheels=(dist/*-py3-none-any.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one pure fallback wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          uvx --from "$wheel" wisp --help
          UV_TOOL_DIR="$RUNNER_TEMP/wisp-tools" \
            UV_TOOL_BIN_DIR="$RUNNER_TEMP/wisp-bin" \
            uv tool install "$wheel"
          pushd "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/wisp-home" \
            "$RUNNER_TEMP/wisp-bin/wisp" -p "hello" --provider fake
          popd

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload live RPC schema bundle
        uses: actions/upload-artifact@v4
        with:
          name: live-rpc-schema
          path: release-assets/
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-rpc-schema
          path: release-assets/

      - name: Attest distributions and release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*
            release-assets/*

  publish:
    name: Publish to PyPI
    needs:
      - build
      - attest
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Trusted Publishing exchanges this short-lived OIDC token for an upload
    # credential, so no PyPI API token is stored in repository secrets.
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub release
    needs:
      - build
      - attest
      - publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download live RPC schema bundle
        uses: actions/download-artifact@v4
        with:
          name: live-rpc-schema
          path: release-assets/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${release_flags[@]}" \
            --generate-notes \
            --title "Wisp $GITHUB_REF_NAME"
