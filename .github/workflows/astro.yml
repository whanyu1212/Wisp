name: Astro site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "book/src/**"
      - "book/migration/astro/**"
      - "examples/crafting_agents/**"
      - "assets/**"
      - ".github/workflows/astro.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "book/src/**"
      - "book/migration/astro/**"
      - "examples/crafting_agents/**"
      - "assets/**"
      - ".github/workflows/astro.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Astro site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test content pipeline
        run: npm test

      - name: Check Astro types
        run: npm run check

      - name: Build and validate routes, anchors, links, and assets
        run: npm run build

      - name: Check formatting
        run: npm run format:check
