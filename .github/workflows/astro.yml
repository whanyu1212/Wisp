name: Astro site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "book/src/**"
      - "book/migration/astro/**"
      - "examples/crafting_agents/**"
      - "assets/**"
      - ".github/workflows/astro.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "book/src/**"
      - "book/migration/astro/**"
      - "examples/crafting_agents/**"
      - "assets/**"
      - ".github/workflows/astro.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Astro site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep this version aligned with @playwright/test in site/package-lock.json.
    # The image includes browsers and OS dependencies, avoiding apt mirror stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Verify Playwright image version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            if (lock.packages["node_modules/@playwright/test"].version !== "1.64.1") {
              throw new Error("Update the Playwright image in .github/workflows/astro.yml");
            }
          '

      - name: Test content pipeline
        run: npm test

      - name: Check Astro types
        run: npm run check

      - name: Build and validate routes, anchors, links, and assets
        run: npm run build

      - name: Check built-site layouts and keyboard behavior
        run: npm run test:browser

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-browser-traces
          path: site/test-results/
          if-no-files-found: ignore
