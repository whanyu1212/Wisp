name: Live RPC schema history

on:
  pull_request_target:
    types:
      - opened
      - edited
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  immutable-history:
    name: Preserve committed protocol versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Execute only trusted base code. PR files are read as JSON metadata;
      # neither the PR checkout nor its dependencies are installed or executed.
      - name: Check out trusted schema history and policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            schemas/live-rpc
            src/wisp/rpc

      - name: Protect historical bundles and permit current-version updates
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$CHANGED_FILES" -gt 3000 ]; then
            printf 'Cannot verify immutable protocol history for a PR with more than 3,000 files.\n' >&2
            exit 1
          fi
          changes="$(mktemp)"
          trap 'rm -f "$changes"' EXIT
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$changes"
          python3 src/wisp/rpc/protocol_history.py \
            --changes-json "$changes" --expected-files "$CHANGED_FILES"
