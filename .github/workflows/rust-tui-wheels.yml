name: RC2 public installation verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    name: Public PyPI install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux_2_28 x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            tag: py3-none-manylinux_2_28_x86_64
            python: /opt/python/cp312-cp312/bin/python
          - name: macOS arm64
            runner: macos-15
            container: null
            tag: py3-none-macosx_11_0_arm64
            python: python
          - name: macOS x86_64
            runner: macos-15-intel
            container: null
            tag: py3-none-macosx_11_0_x86_64
            python: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out immutable release verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: af13bf11fce1575ca760a87a3a552b41165141b7
          path: release-source
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up macOS Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public PyPI install and lifecycle
        shell: bash
        run: |
          "${{ matrix.python }}" scripts/verify_published_rust_tui.py \
            --tag '${{ matrix.tag }}' \
            --uv "$(command -v uv)" \
            --release-source "$GITHUB_WORKSPACE/release-source" \
            --work-dir "$RUNNER_TEMP/rc2-public-install"
      - name: Upload public installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-install-${{ matrix.tag }}
          path: ${{ runner.temp }}/rc2-public-install/artifacts/
          if-no-files-found: error
