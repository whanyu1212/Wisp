name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "book.toml"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - "theme/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "book.toml"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - "theme/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep production build + deploy runs ordered as one unit so an older build
# cannot publish after a newer commit. Pull-request builds use independent groups.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_MERMAID_VERSION: "0.17.1"
  LYCHEE_VERSION: "0.24.2"

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install documentation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$HOME/.cargo/bin" --strip-components=1 \
              lychee-x86_64-unknown-linux-gnu/lychee

      - name: Build book
        run: mdbook build

      - name: Check rendered links
        run: lychee --offline --no-progress --fallback-extensions html --exclude-path 'book/404.html' book

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
