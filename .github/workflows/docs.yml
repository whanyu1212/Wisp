name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "examples/crafting_agents/**"
      - "examples/sdk/**"
      - "tests/docs/**"
      - "tests/repository/test_images.py"
      - "tests/support/**"
      - "pyproject.toml"
      - "uv.lock"
      - "assets/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "examples/crafting_agents/**"
      - "examples/sdk/**"
      - "tests/docs/**"
      - "tests/repository/test_images.py"
      - "tests/support/**"
      - "pyproject.toml"
      - "uv.lock"
      - "assets/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Order production build/deploy/smoke runs so an older build cannot publish last.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check Astro site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this version aligned with @playwright/test in site/package-lock.json.
    # The image includes browsers and OS dependencies, avoiding apt mirror stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Verify Playwright image version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            if (lock.packages["node_modules/@playwright/test"].version !== "1.64.1") {
              throw new Error("Update the Playwright image in .github/workflows/docs.yml");
            }
          '

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run curriculum checkpoints offline
        working-directory: .
        run: |
          python -m examples.crafting_agents.checkpoint_01
          python -m examples.crafting_agents.checkpoint_02
          python -m examples.crafting_agents.checkpoint_02 --deny-edits
          python -m examples.crafting_agents.checkpoint_03
          python -m examples.crafting_agents.checkpoint_03 --untrusted
          python -m examples.crafting_agents.checkpoint_03 --long-guidance
          python -m examples.crafting_agents.checkpoint_03 --deny-edits
          python -m examples.crafting_agents.checkpoint_04
          python -m examples.crafting_agents.checkpoint_04 --scenario retry
          python -m examples.crafting_agents.checkpoint_04 --scenario disconnect
          python -m examples.crafting_agents.checkpoint_04 --scenario malformed
          python -m examples.crafting_agents.checkpoint_04 --scenario output-limit
          python -m examples.crafting_agents.checkpoint_05
          python -m examples.crafting_agents.checkpoint_05 --scenario policy-denied
          python -m examples.crafting_agents.checkpoint_05 --scenario approval-denied
          python -m examples.crafting_agents.checkpoint_05 --scenario stale-input

      - name: Verify documentation contracts and SDK examples
        working-directory: .
        run: uv run --locked pytest tests/docs tests/repository/test_images.py

      - name: Test content pipeline
        run: npm test

      - name: Check Astro types
        run: npm run check

      - name: Build and validate routes, anchors, links, and assets
        run: npm run build

      - name: Check built-site layouts and keyboard behavior
        run: npm run test:browser

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-browser-traces
          path: site/test-results/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify deployed Astro site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Check deployed revision, legacy links, search, themes, and diagrams
        env:
          WISP_DOCS_URL: ${{ needs.deploy.outputs.page_url }}
          WISP_DOCS_REVISION: ${{ github.sha }}
        run: npm run test:deployed
