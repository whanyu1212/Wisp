[project]
name = "wisp-ai"
version = "0.1.0a2"
description = "Terminal-first coding agent with typed CLI, TUI, RPC, and SDK interfaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "whanyu1212", email = "whanyu1212@hotmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "agent",
    "ai",
    "cli",
    "coding-agent",
    "llm",
    "tui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.116.0",
    "anyio>=4.14.1",
    "google-genai>=2.12.0",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "packaging>=26.0",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/whanyu1212/Wisp"
Repository = "https://github.com/whanyu1212/Wisp"
Changelog = "https://github.com/whanyu1212/Wisp/blob/main/CHANGELOG.md"
Issues = "https://github.com/whanyu1212/Wisp/issues"

[project.scripts]
wisp = "wisp.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wisp"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tui: headless Textual integration tests",
    "process: tests covering process-backed tools or process trees",
    "benchmark: deterministic performance and resource-bound scenarios",
    "slow: intentionally long-running tests outside the other categories",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wisp"]
