[project]
name = "wisp"
version = "0.1.0"
description = "Python, Pi-inspired coding agent"
authors = [
    { name = "whanyu1212", email = "whanyu1212@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.1",
    "httpx>=0.28.1",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
wisp = "wisp.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wisp"]
