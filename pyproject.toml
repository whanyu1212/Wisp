[project]
name = "wisp-ai"
version = "0.1.0"
description = "Python, Pi-inspired coding agent"
authors = [
    { name = "whanyu1212", email = "whanyu1212@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "anyio>=4.14.1",
    "google-genai>=2.12.0",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.26.8",
]

[project.scripts]
wisp = "wisp.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wisp"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tui: headless Textual integration tests",
    "process: tests that launch real subprocesses or exercise process trees",
    "benchmark: deterministic performance and resource-bound scenarios",
    "slow: intentionally long-running tests outside the other categories",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wisp"]
