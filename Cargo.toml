[workspace]
members = ["rust/wisp-protocol", "rust/wisp-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
typify = "=0.5.0"
regress = "=0.10.4"
chrono = { version = "0.4.41", features = ["serde"] }
jsonschema = { version = "0.50.0", default-features = false }
bytes = "=1.10.1"
clap = { version = "=4.5.32", features = ["derive"] }
crossterm = "=0.28.1"
nix = { version = "=0.29.0", features = ["process", "signal"] }
pulldown-cmark = "=0.13.4"
ratatui = "=0.29.0"
sha2 = "=0.10.9"
syntect = { version = "=5.3.0", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
thiserror = "=2.0.18"
tokio = { version = "=1.44.2", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.0"
