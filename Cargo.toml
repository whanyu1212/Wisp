[workspace]
members = ["rust/wisp-protocol"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
typify = "0.7.0"
regress = "0.11.1"
chrono = { version = "0.4.41", features = ["serde"] }
