[package]
name = "wisp-search"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
regex.workspace = true

[target.'cfg(unix)'.dependencies]
# 0.29 takes raw descriptors, which Python hands over as integers; later versions
# take `AsFd`, which would need `unsafe` to wrap them.
nix = { workspace = true, features = ["dir", "fs"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
